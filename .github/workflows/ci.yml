name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 8
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Clippy
        run: cd backend && cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cd backend && cargo test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust & Soroban
        uses: dtolnay/rust-toolchain@stable
      - name: Test Contracts
        run: cd backend && cargo test --all-features
      - name: Contract resource benchmarks
        # Emits ::warning:: annotations for entrypoints >10% over
        # backend/contracts/benchmarks.json without failing the job.
        run: cd backend && cargo test -p contract-benchmarks -- --nocapture

  contract-bindings:
    name: Contract TypeScript Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Regenerate bindings
        run: ./scripts/generate-contract-bindings.sh
      - name: Fail if committed bindings are stale
        run: |
          if [ -n "$(git status --porcelain -- packages/contracts-ts)" ]; then
            git status --short -- packages/contracts-ts
            git diff -- packages/contracts-ts | head -200
            echo "::error::packages/contracts-ts is out of date. Run ./scripts/generate-contract-bindings.sh and commit the result."
            exit 1
          fi
      - name: Type-check bindings
        run: pnpm exec tsc -p packages/contracts-ts

  reproducible-build:
    name: Verify Reproducible Contract Hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build & verify hashes
        run: ./scripts/verify.sh
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: soroban-contracts-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  docker-app:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -f Dockerfile.app -t stellar-creator-portfolio:${{ github.sha }} .
      - name: Verify image size under 300MB
        run: |
          SIZE=$(docker image inspect stellar-creator-portfolio:${{ github.sha }} --format='{{.Size}}')
          echo "Image size: $SIZE bytes"
          if [ "$SIZE" -gt 314572800 ]; then
            echo "Image exceeds 300MB limit"
            exit 1
          fi
